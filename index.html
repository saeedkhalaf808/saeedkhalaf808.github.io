<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Overload</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--edge:#bfe9ff;--edge2:#4a9ae8}
html,body{margin:0;height:100%;background:#0f1226;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;padding:calc(12px + env(safe-area-inset-top,0px)) 20px 8px;pointer-events:none}
#sc{font-size:46px;font-weight:700;line-height:1;transform-origin:left bottom;text-shadow:0 3px 0 rgba(0,0,0,.35)}
#sc.bump{animation:bump .24s ease-out}
@keyframes bump{40%{transform:scale(1.22);color:#ffe14a}}
#bs{font-size:16px;font-weight:600;color:#c9d4ff}
#ui{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;padding:38px 14px 22px;box-sizing:border-box;overflow:auto;background:linear-gradient(#2b2180 0%,#1a1456 55%,#100b38 100%)}
#uic{display:contents}
#bub{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.b{position:absolute;bottom:-120px;border-radius:50%;--o:.8;opacity:0;
  background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.95) 0 6%,rgba(255,255,255,0) 7%),radial-gradient(circle at 50% 55%,rgba(255,255,255,0) 50%,var(--c) 100%);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.28),inset 0 -6px 14px var(--c),0 0 18px var(--c);
  animation:rise 20s linear infinite,sway 4s ease-in-out infinite alternate;will-change:translate,transform}
.b.front{--o:.32;filter:blur(.6px)}
#bub2{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:2}
.b.far{--o:.4;filter:blur(1.2px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),inset 0 -4px 10px var(--c)}
@keyframes rise{0%{translate:0 0;opacity:0}8%{opacity:var(--o)}88%{opacity:var(--o)}100%{translate:0 -125vh;opacity:0}}
@keyframes sway{from{transform:translateX(-14px) scale(.96)}to{transform:translateX(14px) scale(1.04)}}
@media (prefers-reduced-motion:reduce){.b{animation:none;opacity:.2;bottom:auto;top:40%}}
.card{z-index:1}
/* glossy panel with a ribbon title, like a classic game menu */
.card{width:100%;max-width:350px;position:relative;margin:auto;padding:38px 16px 18px;box-sizing:border-box;text-align:center;border-radius:26px;
  background:linear-gradient(#4339a8 0,#2f2787 38%,#241d6b 100%);border:4px solid var(--edge);
  box-shadow:0 0 0 3px var(--edge2),0 10px 0 3px #0e0a30,inset 0 3px 0 rgba(255,255,255,.28),inset 0 -14px 24px rgba(10,6,50,.35)}
.card>h1:first-child{position:absolute;top:-27px;left:50%;transform:translateX(-50%);margin:0;padding:6px 26px 8px;font-size:24px;line-height:1.1;white-space:nowrap;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#fff;
  background:linear-gradient(#ffe27a,#ffbf2e 55%,#f59b12);border-radius:12px;border-bottom:4px solid #c9730a;-webkit-text-stroke:3px #b8680a;paint-order:stroke fill;text-shadow:0 2px 0 #b8680a;box-shadow:0 5px 0 rgba(0,0,0,.28)}
.card>h1:first-child::before,.card>h1:first-child::after{content:"";position:absolute;top:9px;width:22px;height:100%;background:#e08a0b;z-index:-1;border-bottom:4px solid #a85c06}
.card>h1:first-child::before{left:-15px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,38% 50%);border-radius:6px 0 0 6px}
.card>h1:first-child::after{right:-15px;clip-path:polygon(0 0,100% 0,62% 50%,100% 100%,0 100%);border-radius:0 6px 6px 0}
h1{margin:0 0 6px;font-size:30px}
p{margin:6px 0 12px;font-size:17px;line-height:1.35;color:#dcd9ff;font-weight:500}
b{font-weight:700;color:#fff}
.sm{font-size:14px;margin:8px 0 0;min-height:18px}
.tag{margin:0 0 6px;font-size:14px;font-weight:700;color:#ffd27a;letter-spacing:.08em;text-transform:uppercase}
.lbl{font-size:13px;font-weight:700;color:#ffd27a;text-align:left;margin:14px 2px 6px;letter-spacing:.08em;text-transform:uppercase}
/* candy buttons */
button{font:inherit;font-weight:700;font-size:20px;letter-spacing:.02em;border:0;border-radius:999px;padding:12px 22px 14px;width:100%;margin-top:12px;color:#fff;cursor:pointer;position:relative;
  text-shadow:0 2px 0 rgba(0,0,0,.35);background:linear-gradient(#8bec97 0,#4ccd62 55%,#37b34f 100%);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.5),inset 0 -4px 0 rgba(0,0,0,.1),0 5px 0 #1f7a35,0 9px 12px rgba(0,0,0,.35);transition:transform .06s}
button:active{transform:translateY(4px);box-shadow:inset 0 3px 0 rgba(255,255,255,.4),0 1px 0 #1f7a35,0 3px 6px rgba(0,0,0,.3)}
button:disabled{opacity:.5}
.alt{background:linear-gradient(#85ccff,#4a9dee 55%,#3584da);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),inset 0 -4px 0 rgba(0,0,0,.1),0 5px 0 #1d5aa8,0 9px 12px rgba(0,0,0,.35)}
.alt:active{box-shadow:inset 0 3px 0 rgba(255,255,255,.4),0 1px 0 #1d5aa8,0 3px 6px rgba(0,0,0,.3)}
.danger{background:linear-gradient(#ff9494,#f2575f 55%,#d8404c);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),inset 0 -4px 0 rgba(0,0,0,.1),0 5px 0 #9d2230,0 9px 12px rgba(0,0,0,.35)}
.danger:active{box-shadow:inset 0 3px 0 rgba(255,255,255,.4),0 1px 0 #9d2230,0 3px 6px rgba(0,0,0,.3)}
.play{font-size:27px;padding:14px 22px 16px;margin-top:16px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:8px}
.seg+.seg{margin-top:8px}
.seg button{margin:0;padding:8px 4px 10px;font-size:15px;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:linear-gradient(#85ccff,#4a9dee 55%,#3584da);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 4px 0 #1d5aa8,0 6px 8px rgba(0,0,0,.3)}
.seg button.on{background:linear-gradient(#ffe27a,#ffbf2e 55%,#f59b12);box-shadow:inset 0 3px 0 rgba(255,255,255,.6),0 4px 0 #b8680a,0 6px 8px rgba(0,0,0,.3);text-shadow:0 2px 0 #b8680a}
.seg small{font-size:11px;font-weight:600;opacity:.9}
/* mode tiles */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mc{margin:0;padding:10px 6px 12px;border-radius:18px;font-size:18px;display:flex;flex-direction:column;align-items:center;gap:2px;background:linear-gradient(#85ccff,#4a9dee 55%,#3584da);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 4px 0 #1d5aa8,0 7px 10px rgba(0,0,0,.3)}
.mc .ic{font-size:30px;line-height:1.1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.mc small{font-size:12px;font-weight:600;color:#eaf6ff;text-shadow:none;opacity:.92}
.mc.on{background:linear-gradient(#ffe27a,#ffbf2e 55%,#f59b12);box-shadow:inset 0 3px 0 rgba(255,255,255,.6),0 4px 0 #b8680a,0 0 0 3px #fff,0 8px 12px rgba(0,0,0,.35);transform:translateY(-2px);text-shadow:0 2px 0 #b8680a}
.mc.on small{color:#fff8dc}
.row4{display:grid;grid-template-columns:1.55fr 1fr 1fr 1fr;gap:8px;margin-top:14px}
.row4 button{margin:0;padding:8px 2px 10px;font-size:12px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:1px;background:linear-gradient(#85ccff,#4a9dee 55%,#3584da);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 4px 0 #1d5aa8}
.row4 i{font-style:normal;font-size:22px;line-height:1.1}
/* player bar */
.hudbar{display:flex;align-items:center;gap:10px;margin:0;padding:6px 14px 6px 6px;border-radius:999px;background:linear-gradient(#2a2377,#1b1559);border:3px solid #6fb8ff;box-shadow:inset 0 2px 0 rgba(255,255,255,.15);cursor:pointer;text-align:left}
.lvl{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(#ffe27a,#ffa21f);border:3px solid #fff3b0;box-shadow:0 3px 0 #b8680a;font-size:22px;font-weight:700;color:#fff;text-shadow:0 2px 0 #b8680a}
.hb{flex:1;min-width:0}
.hn{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stk{font-weight:700;font-size:17px;color:#ffd27a}
.xpbar{height:12px;border-radius:99px;background:#150f45;border:2px solid #0d0932;overflow:hidden;margin:4px 0 0;box-shadow:inset 0 2px 3px rgba(0,0,0,.4)}
.xpbar i{display:block;height:100%;background:linear-gradient(#a5ffb0,#47d35f);border-radius:99px;box-shadow:inset 0 2px 0 rgba(255,255,255,.5)}
.pillrow{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 0}
.netpill{font-size:13px;font-weight:600;padding:2px 10px;border-radius:99px;border:2px solid}
.netpill.on{color:#7dffa0;border-color:#2f9e55;background:rgba(40,170,90,.18)}
.netpill.off{color:#ff9a9a;border-color:#a63b45;background:rgba(200,60,70,.18)}
.risk{font-size:13px;color:#ffd27a;font-weight:600}
/* inputs, lists, stats */
input{width:100%;box-sizing:border-box;margin-top:12px;padding:13px 14px;font:inherit;font-weight:600;font-size:18px;border-radius:16px;border:3px solid #5aa8f0;background:#120d3a;color:#fff;text-align:center;box-shadow:inset 0 3px 6px rgba(0,0,0,.45);user-select:text;-webkit-user-select:text;touch-action:auto}
input::placeholder{color:#8a86c8}
.rows{margin:10px 0 4px;text-align:left;min-height:120px;background:#150f45;border-radius:16px;border:3px solid #0d0932;padding:4px 10px;box-shadow:inset 0 3px 6px rgba(0,0,0,.4)}
.r{display:grid;grid-template-columns:34px 1fr auto;gap:8px;padding:8px 2px;border-bottom:2px solid rgba(255,255,255,.07);align-items:center;font-size:17px;font-weight:600}
.r:last-child{border-bottom:0}
.rk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#33298a;font-size:14px;font-weight:700}
.rk.r1{background:linear-gradient(#ffe27a,#f59b12);color:#7a4300}
.rk.r2{background:linear-gradient(#f2f6ff,#a9b6d6);color:#3a4560}
.rk.r3{background:linear-gradient(#ffc08a,#c9702d);color:#5a2a00}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.stats div{background:#150f45;border:3px solid #0d0932;border-radius:14px;padding:8px;font-size:13px;color:#b9b4f0;font-weight:600;box-shadow:inset 0 2px 4px rgba(0,0,0,.4)}
.stats b{display:block;font-size:20px;color:#fff;margin-top:2px}
.stars3{display:flex;justify-content:center;align-items:flex-end;gap:4px;margin:4px 0 6px}
.stars3 svg{filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.bigscore{font-size:54px;font-weight:700;color:#ffd24a;text-shadow:0 4px 0 #b8680a;line-height:1;margin:2px 0 4px}
.code{font-size:46px;font-weight:700;letter-spacing:.12em;color:#ffd24a;text-shadow:0 3px 0 #b8680a;margin:4px 0 8px}
.ringwrap{position:relative;width:140px;height:140px;margin:10px auto}
.ringnum{position:absolute;inset:0;display:grid;place-items:center;font-size:54px;font-weight:700;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.spin{width:46px;height:46px;border:6px solid #150f45;border-top-color:#ffc83a;border-radius:50%;margin:18px auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hw{display:flex;gap:12px;align-items:center;text-align:left;margin:12px 0;font-size:17px;line-height:1.35;color:#dcd9ff}
.hw i{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;color:#10132a;box-shadow:0 3px 0 rgba(0,0,0,.3)}
#ctrl{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:8px 16px calc(12px + env(safe-area-inset-bottom,0px))}
#ctrl button{width:auto;margin:0;padding:9px 28px 11px;font-size:17px;background:linear-gradient(#85ccff,#4a9dee 55%,#3584da);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 4px 0 #1d5aa8,0 7px 10px rgba(0,0,0,.35)}
#tip{position:fixed;left:16px;right:16px;display:none;background:linear-gradient(#352d85,#241d6b);border:3px solid #ffc83a;border-radius:18px;padding:10px 14px;font-weight:600;font-size:16px;line-height:1.35;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.35);pointer-events:none;max-width:420px;margin:0 auto}
.lbcard{max-width:380px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none;touch-action:pan-x}
.tabs::-webkit-scrollbar,.pages::-webkit-scrollbar{display:none}
.tab{flex:none;width:auto;margin:0;padding:6px 14px 8px;font-size:15px;background:linear-gradient(#85ccff,#4a9dee 55%,#3584da);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 4px 0 #1d5aa8}
.tab.on{background:linear-gradient(#ffe27a,#ffbf2e 55%,#f59b12);box-shadow:inset 0 3px 0 rgba(255,255,255,.6),0 4px 0 #b8680a;text-shadow:0 2px 0 #b8680a}
.pages{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -8px;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
.page{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;max-height:min(58vh,520px);overflow-y:auto;padding:0 8px;box-sizing:border-box;touch-action:pan-y;scrollbar-width:none}
.pload{padding:46px 10px;color:#b9b4f0;font-weight:600;text-align:center}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin:4px 0 12px}
.pod{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.pod.p1{margin-bottom:26px}
.pod .crown{margin-bottom:-4px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
.pod.empty{opacity:.35}
.pn{font-weight:700;font-size:14px;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:5px}
.ps{font-size:13px;font-weight:700;color:#ffd27a}
.pb{width:40px;height:40px;margin-top:12px;transform:rotate(45deg);border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,#9aa9ff,#5a63d8);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 4px 0 #2b2f88}
.pb span{transform:rotate(-45deg);font-weight:700;font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.p1 .pb{background:linear-gradient(135deg,#ffe27a,#f59b12);box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 4px 0 #b8680a}
.p2 .pb{background:linear-gradient(135deg,#f2f6ff,#a9b6d6);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 4px 0 #6d7a99}.p2 .pb span{color:#3a4560;text-shadow:none}
.p3 .pb{background:linear-gradient(135deg,#ffc08a,#c9702d);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 4px 0 #8a4a14}
.av{border-radius:50%;display:grid;place-items:center;font-weight:700;color:#10132a;border:3px solid rgba(255,255,255,.75);box-shadow:0 3px 0 rgba(0,0,0,.3);flex:none}
.pod.me .av{border-color:#ffd24a}
.lrow{display:flex;align-items:center;gap:10px;background:#150f45;border:3px solid #0d0932;border-radius:16px;padding:6px 12px 6px 10px;margin:8px 0;box-shadow:inset 0 2px 4px rgba(0,0,0,.4);text-align:left}
.lrow.me{border-color:#ffc83a}
.lrk{width:22px;font-weight:700;color:#9a96dd;text-align:center}
.ln{flex:1;min-width:0;font-weight:600;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lsc{font-weight:700;color:#ffd27a;font-size:16px}
.duo button{font-size:18px}

/* ---- BIG THING STUDIOS intro ---- */
#intro{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#05030f;overflow:hidden}
#intro.done{opacity:0;transition:opacity .6s .2s ease-in;pointer-events:none}
.i-studio{font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;font-size:17px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:#9a96dd;opacity:0;animation:iSt 1.1s 0.5s cubic-bezier(.2,0,.4,1) forwards}
@keyframes iSt{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.i-sep{width:0;height:2px;background:linear-gradient(90deg,transparent,#5a52c8,transparent);opacity:0;animation:iSep 0.8s 1.3s ease forwards;margin:10px 0 24px}
@keyframes iSep{from{opacity:0;width:0}to{opacity:.7;width:220px}}
.i-bg{position:absolute;inset:0;pointer-events:none}
.i-spark{position:absolute;border-radius:50%;transform-origin:center;animation:iSp var(--d) var(--dl) ease-out forwards}
@keyframes iSp{0%{opacity:0;transform:scale(0) translate(0,0)}15%{opacity:1}100%{opacity:0;transform:scale(var(--s)) translate(var(--tx),var(--ty))}}
.i-ring{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%) scale(0);animation:iRing var(--d) var(--dl) ease-out forwards;border:3px solid var(--c);box-shadow:0 0 14px var(--c)}
@keyframes iRing{0%{opacity:1;transform:translate(-50%,-50%) scale(0)}100%{opacity:0;transform:translate(-50%,-50%) scale(var(--s))}}
.i-title-wrap{position:relative;overflow:visible;height:110px;width:360px;display:flex;align-items:center;justify-content:center}
.i-shadow{position:absolute;top:50%;left:50%;transform:translate(-50%,34px) scale(1,.18);filter:blur(14px);font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;font-size:88px;font-weight:700;color:rgba(255,176,46,.55);white-space:nowrap;animation:iShd 1s 2.0s ease-out backwards;opacity:0}
@keyframes iShd{0%{opacity:0;transform:translate(-50%,44px) scale(1.4,.12)}100%{opacity:1;transform:translate(-50%,34px) scale(1,.18)}}
.i-title{font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;font-size:88px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;position:relative;
  background:linear-gradient(180deg,#ffffff 0%,#ffe27a 45%,#ff9c26 75%,#ff5a1a 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 24px rgba(255,160,30,.75)) drop-shadow(0 4px 2px rgba(0,0,0,.7));
  opacity:0;transform:translateY(-130px) scale(1.6);animation:iDrop 0.5s 2.0s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes iDrop{0%{opacity:1;transform:translateY(-130px) scale(1.6)}70%{transform:translateY(6px) scale(.97)}100%{opacity:1;transform:none}}
.i-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;animation:iFlash .22s 2.52s ease-out forwards}
@keyframes iFlash{0%{opacity:.75}100%{opacity:0}}
.i-sub{font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;font-size:15px;font-weight:600;letter-spacing:.14em;color:#ff9c26;opacity:0;animation:iSb .6s 2.8s ease forwards;margin-top:8px}
@keyframes iSb{from{opacity:0;transform:translateY(8px)}to{opacity:.8;transform:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div id="sc">0</div><div id="bs"></div></div>
<div id="ctrl"><button id="mn">⏸ Pause</button></div>
<div id="tip"></div>
<div id="ui"><div id="bub"></div><div id="uic"></div><div id="bub2"></div></div>
<script>
const c=document.getElementById('c'),g=c.getContext('2d'),uiEl=document.getElementById('ui'),uic=document.getElementById('uic');
const ui={style:uiEl.style,get innerHTML(){return uic.innerHTML},set innerHTML(v){uic.innerHTML=v;uiEl.scrollTop=0}};   // screens render into #uic so the bubbles in #ui keep floating
const COLS=7,ROWS=9,D=[[1,0],[-1,0],[0,1],[0,-1]];
let CC=['','#38c6f4','#4cd97b','#ffb02e'],SUR='#c86bfa';
// Online leaderboard and 1v1: paste your Supabase project URL and public key here (see README). Leave empty to switch online features off.
const LB={url:'',key:''};
const MODES=[['classic','Endless','Play until the board fills. It keeps getting harder the longer you last.'],['timed','Timed','60 seconds. Big chains earn bonus time.'],['versus','1v1','Challenge a friend. Same board, 60 seconds, most points wins.'],['daily','Daily','The same board for everyone today.']];
const NAMES={classic:'Endless',timed:'Timed',versus:'1v1',daily:'Daily'},ICON={classic:'♾️',timed:'⏱️',versus:'⚔️',daily:'📅'};
const ls=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

// Anime-style impact frames: a few hard cuts of black and a flat colour with speed lines and a starburst.
function startImpact(word,col,x,y,light){
  if(!fxFlash)return;
  const now=performance.now();
  if(!light&&now-lastImpact<3500)return;
  lastImpact=now;
  const rays=Array.from({length:44},(_,i)=>({a:i/44*6.283+(Math.random()-.5)*.1,w:.01+Math.random()*.035,len:.65+Math.random()*.5}));
  impact={t0:now,dur:light?270:340,word,col,x,y,rays};
  shake=Math.max(shake,light?10:18);tone(70,.3,.22);tone(150,.15,.12);buzz([40,20,60]);
}

  const I=impact,e=now-I.t0;
  if(e>=I.dur){impact=null;return}
  const ph=e<70?0:e<140?1:e<210?2:3,fade=ph===3?Math.max(0,1-(e-210)/(I.dur-210)):1;
  const bg=ph===1?I.col:'#05060f',fg=ph===0?'#ffffff':ph===1?'#05060f':I.col;
  g.setTransform(d,0,0,d,0,0);g.save();

  g.globalAlpha=fade;g.fillStyle=bg;g.fillRect(-20,-20,W+40,H+40);
  const R=Math.hypot(W,H),r0=Math.min(W,H)*.13;

    g.lineTo(I.x+Math.cos(ry.a-ry.w)*L,I.y+Math.sin(ry.a-ry.w)*L);g.lineTo(I.x+Math.cos(ry.a+ry.w)*L,I.y+Math.sin(ry.a+ry.w)*L);g.closePath();g.fill();
  });
  const R1=Math.min(W,H)*.34,R2=R1*.5;
  g.beginPath();for(let i=0;i<28;i++){const rr=i%2?R2:R1,a=i/28*6.283+.2;g.lineTo(I.x+Math.cos(a)*rr,I.y+Math.sin(a)*rr)}g.closePath();g.fill();
  g.translate(I.x,I.y);g.rotate(-.1);g.textAlign='center';g.textBaseline='middle';

  g.font='900 '+fs+'px '+FONT;g.lineWidth=fs*.14;g.lineJoin='round';g.strokeStyle=fg;g.fillStyle=bg;g.strokeText(I.word,0,0);g.fillText(I.word,0,0);
  g.restore();g.globalAlpha=1;
}

const qSince=()=>encodeURIComponent(new Date(Date.now()-60000).toISOString());
async function qFetch(path,opt={}){
  const r=await fetch(LB.url+'/rest/v1/'+path,{...opt,headers:{...hdr(),'Content-Type':'application/json',...(opt.headers||{})}});
  if(!r.ok)throw 0;
  return r.status===204?null:r.json();
}
const qClaim=async r=>{const got=await qFetch('queue?id=eq.'+r.id,{method:'DELETE',headers:{Prefer:'return=representation'}});return got&&got.length?got[0]:null};
function qShow(msg){
  ui.style.display='flex';

async function findMatch(){
  if(!online())return versus();
  qSearching=true;qShow('Looking for another player…');
  const name=(pname||'Player').slice(0,12);
  try{
    // 1) someone is already waiting: claim them
    const rows=await qFetch(`queue?select=id,code,name&created_at=gt.${qSince()}&order=id.asc&limit=10`);
    for(const r of rows){const got=await qClaim(r);if(got&&qSearching)return matched(got.code,got.name)}
    if(!qSearching)return;
    // 2) nobody yet: join the queue and wait
    qCode=randCode();
    const me=await qFetch('queue',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({code:qCode,name})});
    qId=me[0].id;
    if(!qSearching){qLeave();return}
    qShow('You’re in the queue. Waiting for another player… (up to a minute)');
    qPoll(0);
  }catch(e){qSearching=false;qFail('Couldn’t reach matchmaking. Check your internet connection and try again.')}
}
async function qPoll(tries){
  if(!qSearching||qId==null)return;
  try{
    const mine=await qFetch(`queue?select=id&id=eq.${qId}`);
    if(!mine.length){qId=null;qSearching=false;return matched(qCode,null)}   // someone claimed me
    // two people searching at once: the newer entry claims the older one
    const older=await qFetch(`queue?select=id,code,name&created_at=gt.${qSince()}&id=lt.${qId}&order=id.asc&limit=5`);
    for(const r of older){
      const got=await qClaim(r);
      if(got){qLeave();qSearching=false;return matched(got.code,got.name)}
    }
  }catch(e){}
  if(tries>=30)return qTimeout();
  setTimeout(()=>qPoll(tries+1),2000);
}
function qLeave(){
  if(qId==null)return;
  const id=qId;qId=null;
  qFetch('queue?id=eq.'+id,{method:'DELETE'}).catch(()=>{});
}

  const r=await fetch(q,{headers:hdr()}),a=await r.json(),seen=new Set();if(!Array.isArray(a))throw 0;

function groupMatches(rows){const by=new Map();rows.slice().reverse().forEach(x=>{if(!by.has(x.code))by.set(x.code,[]);by.get(x.code).push(x)});return by}
function winsFrom(rows){
  const wins={},losses={};
  groupMatches(rows).forEach(g=>{
    if(g.length<2||g[0].score===g[1].score)return;
    const w=g[0].score>g[1].score?g[0]:g[1],l=w===g[0]?g[1]:g[0],kw=norm(w.name),kl=norm(l.name);
    wins[kw]=wins[kw]||{name:w.name,w:0};wins[kw].w++;losses[kl]=(losses[kl]||0)+1;
  });
  return Object.entries(wins).map(([k,v])=>({name:v.name,score:v.w,l:losses[k]||0})).sort((a,b)=>b.score-a.score||a.l-b.l).slice(0,25);

// Ranked rating (Elo): worked out from the finished ranked matches, so it always matches the match history.
function eloAll(rows){
  const R={},delta={};
  groupMatches(rows).forEach((g,code)=>{
    if(code[0]!=='R'||g.length<2)return;
    const a=g[0],b=g[1],ka=norm(a.name),kb=norm(b.name);if(ka===kb)return;
    const ra=R[ka]=R[ka]||{name:a.name,rating:1000,w:0,l:0,n:0},rb=R[kb]=R[kb]||{name:b.name,rating:1000,w:0,l:0,n:0};
    const ea=1/(1+Math.pow(10,(rb.rating-ra.rating)/400)),sa=a.score>b.score?1:a.score<b.score?0:.5,da=Math.round(32*(sa-ea));
    delta[code]={[ka]:[ra.rating,ra.rating+da],[kb]:[rb.rating,rb.rating-da]};
    ra.rating+=da;rb.rating-=da;ra.n++;rb.n++;ra.name=a.name;rb.name=b.name;
    if(sa===1){ra.w++;rb.l++}else if(sa===0){rb.w++;ra.l++}
  });
  return{R,delta};
}

if(document.addEventListener)document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){bankNow();if(notifOn){clearTimeout(remTimer);remTimer=setTimeout(()=>notify(cheer()),60000);scheduleReminders()}}else clearTimeout(remTimer)});
addEventListener('pagehide',bankNow);
document.getElementById('mn').onclick=()=>menuPress();
addEventListener('pointerdown',e=>{
  if(ui.style.display==='flex')return;
  const k=Math.floor((e.clientX-gx)/cell),r=Math.floor((e.clientY-gy)/cell);
  if(k>=0&&r>=0&&k<COLS&&r<ROWS)tap(k,r);
});
(function makeBubbles(){
  const root=document.getElementById('bub');if(!root||!root.appendChild)return;
  const cols=['#38c6f4','#4cd97b','#ffb02e','#ff7ad9','#c86bfa'];
  for(let i=0;i<34;i++){
    const front=i>=28,far=i<12,sz=far?10+Math.random()*20:front?20+Math.random()*36:26+Math.random()*58,dur=far?28+Math.random()*16:15+Math.random()*12,b=document.createElement('i');
    b.className='b'+(far?' far':'')+(front?' front':'');
    b.style.cssText='--c:'+cols[i%5]+';width:'+sz+'px;height:'+sz+'px;left:'+(Math.random()*100)+'%;animation-duration:'+dur+'s,'+(3+Math.random()*3)+'s;animation-delay:'+(-Math.random()*dur)+'s,'+(-Math.random()*4)+'s';
    (front?document.getElementById('bub2'):root).appendChild(b);
  }
})();
const cx=k=>gx+(k+.5)*cell,cy=r=>gy+(r+.5)*cell,FONT='"Fredoka","Avenir Next","Trebuchet MS",system-ui,sans-serif';
function frame(){try{drawFrame()}catch(e){if(!frame.err){frame.err=1;console.error(e)}}requestAnimationFrame(frame)}   // one bad frame can never freeze the game
function drawFrame(){
  const now=performance.now(),d=Math.min(devicePixelRatio||1,2),dt=Math.min(.1,(now-last)/1000||0),k60=dt*60;last=now;
  if(timedMode()&&started&&!over&&(mode==='versus'||ui.style.display!=='flex')){tLeft-=dt;if(tLeft<=0){tLeft=0;endGame()}}
  g.setTransform(d,0,0,d,0,0);
  const tgt=themeFor();
  if(tgt!==themeIdx&&started&&!over&&mode!=='versus'&&ui.style.display!=='flex'){applyTheme(tgt);themeChange()}
  bgHue+=(((THEMES[themeIdx].hue-bgHue+540)%360)-180)*Math.min(1,.04*k60);bgHue=(bgHue+360)%360;
  heat=Math.max(0,heat-dt*.22);kick*=Math.pow(.93,k60);
  const hs=Math.round((bgHue+kickDir*kick*.8+360)%360),sat=Math.round(45+heat*30),lit=Math.round(9+heat*8);
  g.fillStyle='hsl('+hs+' '+sat+'% '+lit+'%)';g.fillRect(0,0,W,H);
  g.fillStyle='rgba(170,180,255,.2)';
  bgStars.forEach(s=>{s.y-=s.v*dt*1000*(1+heat*5);if(s.y<0){s.y=1;s.x=Math.random()}g.beginPath();g.arc(s.x*W,s.y*H,s.r,0,7);g.fill()});
  if(shake>.3){g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=Math.pow(.9,k60)}
  const n=countEmpty(),low=n<=8;
  g.fillStyle='hsl('+hs+' '+Math.round(40+heat*25)+'% '+Math.round(14+heat*8)+'%)';g.beginPath();g.roundRect(gx-6,gy-6,cell*COLS+12,cell*ROWS+12,16);g.fill();
  if(low&&!over&&mode!=='tutorial'){g.strokeStyle='rgba(255,93,115,'+(.35+.3*Math.sin(now/180))+')';g.lineWidth=3;g.stroke();g.fillStyle='rgba(255,60,90,'+(.03+.03*Math.sin(now/200))+')';g.fillRect(-30,-30,W+60,H+60)}
  g.textAlign='center';g.textBaseline='middle';
  g.font='800 '+Math.round(cell*.42)+'px '+FONT;
  for(let r=0;r<ROWS;r++)for(let k=0;k<COLS;k++){
    const v=grid[r][k],px=cx(k),py=cy(r);
    if(!v){g.fillStyle='hsl('+hs+' 35% 21%)';g.beginPath();g.arc(px,py,cell*.1,0,7);g.fill();continue}
    const key=r*COLS+k,tb=bumps[key],tn=born[key];
    let sc=1;
    if(tn&&now-tn<300){const q=(now-tn)/300,c1=1.70158,c3=c1+1;sc=Math.max(.01,1+c3*Math.pow(q-1,3)+c1*Math.pow(q-1,2))}   // new dots grow in
    else if(tb&&now-tb<320){const q=(now-tb)/320;sc=1+.3*Math.sin(q*Math.PI)*(1-q*.4)}                                       // charged dots pop
    const pulse=v===3?1+.06*Math.sin(now/110):1,rad=cell*.39*pulse*sc;
    if(v===3||sg[r][k]){g.fillStyle=sg[r][k]?'rgba(200,107,250,.22)':'rgba(255,176,46,.2)';g.beginPath();g.arc(px,py,rad+cell*.1,0,7);g.fill()}
    if(heat>.15){g.fillStyle=hexA(sg[r][k]?SUR:CC[Math.min(v,3)],Math.min(.4,heat*.35));g.beginPath();g.arc(px,py,rad+cell*(.06+heat*.12),0,7);g.fill()}
    g.fillStyle=sg[r][k]?SUR:CC[Math.min(v,3)];g.beginPath();g.arc(px,py,rad,0,7);g.fill();
    if(sg[r][k]){g.strokeStyle='#fff';g.lineWidth=3;g.stroke()}
    g.fillStyle='rgba(255,255,255,.28)';g.beginPath();g.arc(px-cell*.1*sc,py-cell*.12*sc,cell*.13*sc,0,7);g.fill();
    g.fillStyle='#10132a';
    if(sc!==1){g.save();g.translate(px,py+cell*.03);g.scale(sc,sc);g.fillText(v,0,0);g.restore()}else g.fillText(v,px,py+cell*.03);
  }
  if(!over)next.forEach(p=>{
    g.globalAlpha=.6;g.strokeStyle=p.s?SUR:CC[p.v];g.lineWidth=2;g.setLineDash([4,4]);
    g.beginPath();g.arc(cx(p.k),cy(p.r),cell*.3,0,7);g.stroke();g.setLineDash([]);
    g.fillStyle=p.s?SUR:CC[p.v];g.font='700 '+Math.round(cell*.28)+'px '+FONT;g.fillText(p.v,cx(p.k),cy(p.r)+cell*.02);g.globalAlpha=1;
  });
  if(mode==='tutorial'&&!over&&!busy&&TUT[tut.i]){
    const[tr,tk]=TUT[tut.i].target,bob=Math.sin(now/180)*6,ax=cx(tk),ay=cy(tr)-cell*.62+bob;
    g.strokeStyle='#ffe14a';g.lineWidth=4;g.beginPath();g.arc(cx(tk),cy(tr),cell*(.5+.05*Math.sin(now/150)),0,7);g.stroke();
    g.fillStyle='#ffe14a';g.beginPath();g.moveTo(ax,ay);g.lineTo(ax-cell*.24,ay-cell*.4);g.lineTo(ax+cell*.24,ay-cell*.4);g.closePath();g.fill();
    g.fillRect(ax-cell*.08,ay-cell*.4-cell*.3,cell*.16,cell*.32);
  }
  fx=fx.filter(f=>now-f.t0<f.dur);
  fx.forEach(f=>{
    const p=(now-f.t0)/f.dur;
    if(f.type==='ring'){g.globalAlpha=1-p;g.strokeStyle=f.col;g.lineWidth=4;g.beginPath();g.arc(cx(f.x),cy(f.y),cell*(.3+p*.9),0,7);g.stroke()}
    else{g.globalAlpha=1;g.fillStyle='#fff';g.beginPath();g.arc(cx(f.x)+(cx(f.x1)-cx(f.x))*p,cy(f.y)+(cy(f.y1)-cy(f.y))*p,cell*.1,0,7);g.fill()}
  });
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{p.x+=p.vx*k60;p.y+=p.vy*k60;p.vy+=.12*k60;p.vx*=Math.pow(.985,k60);p.life-=.022*k60;g.globalAlpha=Math.max(0,p.life);g.fillStyle=p.col;g.beginPath();g.arc(p.x,p.y,p.sz*Math.max(.3,p.life),0,7);g.fill()});
  g.globalAlpha=1;
  if(flash>.01){
    if(fxFlash){const gr=g.createRadialGradient(W/2,H/2,Math.min(W,H)*.25,W/2,H/2,Math.hypot(W,H)*.55);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,hexA(flashCol,Math.min(.55,flash*1.6)));g.fillStyle=gr;g.fillRect(-30,-30,W+60,H+60)}   // a coloured glow at the edges, not white
    flash*=Math.pow(.88,k60);
  }
  g.fillStyle=low?'#ff8a9a':'#8e98cc';g.font='700 16px '+FONT;
  g.fillText(n+' spaces left',W/2,gy+cell*ROWS+34);
  pops=pops.filter(q=>q.t<70);
  pops.forEach(q=>{
    const grow=q.t<10?.5+q.t*.05:1;
    g.globalAlpha=Math.max(0,1-q.t/70);g.font='800 '+Math.round(cell*.7*q.size*grow)+'px '+FONT;
    g.lineWidth=6;g.strokeStyle='rgba(10,12,28,.9)';g.fillStyle=q.col||'#fff';
    const y=gy+cell*ROWS*.45-q.t*.8+(q.dy||0);g.strokeText(q.txt,W/2,y);g.fillText(q.txt,W/2,y);q.t++;
  });
  g.globalAlpha=1;
  if(impact)drawImpact(now,d);
  shown+=(score-shown)*Math.min(1,.2*k60);if(Math.abs(score-shown)<1)shown=score;
  const sv=Math.round(shown);
  if(sv!==scVal){scVal=sv;scEl.textContent=sv.toLocaleString()}
  if(score>lastBumpScore&&scEl.classList){scEl.classList.remove('bump');void scEl.offsetWidth;scEl.classList.add('bump')}
  lastBumpScore=score;
  const bt=Math.max(best,score).toLocaleString(),lv='Level '+lvl();
  tipEl.style.display=mode==='tutorial'&&!over&&ui.style.display!=='flex'?'block':'none';tipEl.style.top=(gy+6)+'px';
  const bs=mode==='tutorial'?'Tutorial '+Math.min(tut.i+1,TUT.length)+'/'+TUT.length:mode==='versus'?Math.ceil(tLeft)+'s · 1v1':mode==='timed'?(beat?'★ ':'')+Math.ceil(tLeft)+'s · Best '+bt:daily?'Daily · '+lv:(beat?'★ ':'')+lv+' · Best '+bt;
  if(bs!==lastBs){lastBs=bs;bsEl.textContent=bs}
}
grid=Array.from({length:ROWS},()=>Array(COLS).fill(0));sg=grid.map(r=>r.map(()=>false));
frame();
if(!prof)welcome();else{setup();if(!ls('overload-seen',false)){lsSet('overload-seen',true);tutorial()}}
if(prof)ensureName();
if(prof&&(prof.link||sess))syncAcc().then(ok=>{if(ok&&ui.style.display==='flex'&&ui.innerHTML.includes('class=modes'))setup()});
</script>

<script>
(function(){
  var el=document.getElementById('intro'),bg=document.getElementById('ibg');
  if(!el||!bg)return;
  // spawn impact sparks + rings when title slams in at 2.0s
  setTimeout(function(){
    var cols=['#ffd24a','#ffb02e','#ff7a2a','#ffffff','#ff5a1a'],N=40;
    for(var i=0;i<N;i++){
      var sp=document.createElement('div'),a=Math.random()*6.283,dist=55+Math.random()*230,s=0.8+Math.random()*1.5,dur=(0.4+Math.random()*.7)+'s';
      sp.className='i-spark';
      sp.style.cssText='--d:'+dur+';--dl:0s;--s:'+s+';--tx:'+Math.round(Math.cos(a)*dist)+'px;--ty:'+Math.round(Math.sin(a)*dist)+'px;width:'+(3+Math.random()*7)+'px;height:'+(3+Math.random()*7)+'px;left:calc(50% + '+Math.round(Math.cos(a)*10)+'px);top:50%;background:'+cols[i%cols.length]+';box-shadow:0 0 6px '+cols[i%cols.length];
      bg.appendChild(sp);
    }
    for(var j=0;j<4;j++){
      var rg=document.createElement('div');rg.className='i-ring';
      rg.style.cssText='--d:'+(0.55+j*.12)+'s;--dl:'+(j*.06)+'s;--s:'+(1.4+j*.7)+';--c:'+cols[j]+';width:'+(80+j*42)+'px;height:'+(80+j*42)+'px';
      bg.appendChild(rg);
    }
  },2000);
  // auto-dismiss after 3.8s
  setTimeout(function(){el.classList.add('done');setTimeout(function(){el.remove()},850)},3800);
  // tap to skip
  el.addEventListener('pointerdown',function(){el.classList.add('done');setTimeout(function(){el.remove()},600)},{once:true});
})();
</script>
